name: Profile Cards Update

# Replaces the old Vercel Cron + api/update.py setup (deleted):
# renders all SVGs daily and commits them back to main.
on:
  schedule:
    # Midnight Asia/Manila (16:00 UTC), same cadence as the old Vercel cron.
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: a run started by a push waits for the scheduled one
# (and vice versa) instead of racing it to commit the same SVGs.
concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    name: Render profile cards and contribution visuals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render cards
        env:
          # Optional repo secret ACCESS_TOKEN (a PAT) also counts private contributions.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/profile_card.py
          python scripts/activity.py
          python scripts/contrib_graph.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CARDS="dark_mode.svg light_mode.svg activity_dark.svg activity_light.svg graph_dark.svg graph_light.svg"
          # If main moved while we rendered (a push, or another workflow),
          # don't try to merge generated SVGs: start again from the new main,
          # re-render, and retry.
          for attempt in 1 2 3; do
            # Only bump the ?v= cache-buster when the SVGs actually changed,
            # so idle days don't produce empty churn commits.
            git add $CARDS
            if git diff --cached --quiet; then
              echo "Cards unchanged."
              exit 0
            fi
            perl -pi -e 's/\?v=(\d+)/"?v=".($1+1)/e' README.md
            git add $CARDS README.md
            git commit -m "chore: update profile cards"
            if git push; then
              exit 0
            fi
            echo "main moved during the render (attempt $attempt); re-rendering on top of it."
            git fetch origin main
            git reset --hard origin/main
            python scripts/profile_card.py
            python scripts/activity.py
            python scripts/contrib_graph.py
          done
          echo "Could not push after 3 attempts."
          exit 1
